[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hipe"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = [
    "sentence-transformers>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",
    "sentencepiece>=0.2",
    "spacy>=3.7",
    "xgboost>=2.0",
]
kaggle = ["kaggle>=1.6"]

[project.scripts]
hipe = "hipe.cli:main"

[tool.setuptools.packages.find]
include = ["hipe*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
